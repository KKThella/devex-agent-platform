[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "devex-agent-platform"
version = "0.1.0"
description = "AI-powered developer experience platform using multi-agent architecture"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kiran Thella", email = "kiran.cltaltdelete@gmail.com" }]

dependencies = [
    "anthropic>=0.25.0",
    "chromadb>=0.4.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
devex = "cli.main:app"

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest-cov"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
